[package]
name = "parallax"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "parallax: a small language for comparing interventions across the same uncertain worlds"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libm = "0.2"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Golden tests run whole studies; unoptimised interpretation is too slow.
# Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1
